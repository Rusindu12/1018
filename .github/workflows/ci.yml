name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Advisory only: `dart format` output can differ between SDK versions, so a
      # hard gate here would fail builds that are otherwise perfectly fine.
      # Run `dart format lib test` locally before committing.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter=expanded

      - name: Build debug APK (proves the Android build works)
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edulanka-debug-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

  static-verification:
    name: Project verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify project structure, imports, strings, assets and admin panel
        run: python3 tools/verify_project.py

  demo-data:
    name: Demo catalogue is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and compare
        run: |
          python3 tools/seed/generate_demo_data.py
          git diff --exit-code -- app/assets/data \
            || (echo "::error::app/assets/data is stale - run tools/seed/generate_demo_data.py and commit the result" && exit 1)

      - name: Validate JSON assets
        run: |
          python3 - <<'PY'
          import json
          for path in ('app/assets/data/demo_books.json', 'app/assets/data/demo_papers.json'):
              rows = json.load(open(path, encoding='utf-8'))
              assert isinstance(rows, list) and rows, path
              for row in rows:
                  assert row.get('title') and row.get('subject') and row.get('medium'), row
                  assert row.get('pdfUrl'), row
              print(f'{path}: {len(rows)} rows OK')
          PY

      - name: Validate the bundled sample PDF
        run: |
          python3 - <<'PY'
          data = open('app/assets/sample/sample_paper.pdf', 'rb').read()
          assert data.startswith(b'%PDF-'), 'missing PDF header'
          assert data.rstrip().endswith(b'%%EOF'), 'missing PDF trailer'
          assert data.count(b'/Type /Page ') >= 4, 'expected a multi-page sample'
          print(f'sample_paper.pdf: {len(data)} bytes OK')
          PY
