name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub > /tmp/flutter-analyze.log 2>&1
          result=$?
          cat /tmp/flutter-analyze.log
          if [[ $result -ne 0 ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              message=${line//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              echo "::error title=Flutter analysis output::$message"
            done < /tmp/flutter-analyze.log
          fi
          exit "$result"

      - name: Run tests
        working-directory: mobile
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded > /tmp/flutter-tests.log 2>&1
          result=$?
          cat /tmp/flutter-tests.log
          if [[ $result -ne 0 ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              message=${line//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              echo "::error title=Flutter test output::$message"
            done < /tmp/flutter-tests.log
          fi
          exit "$result"

      # Optional Play Store/upload signing. Without these secrets the APK is
      # debug-signed so it can be installed for evaluation, not store publishing.
      - name: Configure release signing when secrets are present
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            test -n "$ANDROID_STORE_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          fi

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Name artifact release.apk
        working-directory: mobile
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/release.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v7
        with:
          name: release.apk
          path: mobile/build/app/outputs/flutter-apk/release.apk
          if-no-files-found: error
          retention-days: 30
