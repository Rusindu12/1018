name: Build Signed APK & Backend Tests

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Generate keys
        run: |
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV
          echo "JWT_SECRET=test-secret-for-ci" >> $GITHUB_ENV
      - name: Run pytest + coverage
        run: ENCRYPTION_KEY=$ENCRYPTION_KEY JWT_SECRET=$JWT_SECRET pytest -v --cov=app --cov-report=term-missing
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/ai-binance.jks
            echo "Keystore decoded"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f "app/ai-binance.jks" ]; then
            cat >> gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=ai-binance.jks
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
            ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk 2>&1 || true
          else
            echo "No keystore - building debug APK as signed fallback"
            ./gradlew assembleDebug --stacktrace
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk || true
          fi

      - name: Build Debug APK for Tag (fallback)
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/**/*.apk') == ''
        run: ./gradlew assembleDebug --stacktrace || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-binance-trader-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
          if-no-files-found: warn

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest || echo "No tests"
