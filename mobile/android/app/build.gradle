apply plugin: 'com.android.application'

/* ---------------------------------------------------------------------
   Versioning is driven from one place so the APK, the web app and the
   GitHub Release always agree.  Bump these two numbers (or pass
   -PversionCode=… -PversionName=…) and rebuild.
   --------------------------------------------------------------------- */
def appVersionCode = (project.findProperty('versionCode') ?: '5').toString().toInteger()
def appVersionName = (project.findProperty('versionName') ?: '5.0.0').toString()

/* Optional release signing.
   Create mobile/android/keystore.properties (never committed — it is in
   .gitignore) or set the ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
   KEY_ALIAS / KEY_PASSWORD secrets in the GitHub Actions workflow:

     storeFile=../../release.keystore
     storePassword=…
     keyAlias=…
     keyPassword=…

   Without it, `assembleRelease` falls back to the debug key so CI still
   produces an installable APK. */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def envStore = System.getenv('ANDROID_KEYSTORE_BASE64')
def hasReleaseSigning = keystoreProperties.getProperty('storePassword') || System.getenv('KEYSTORE_PASSWORD')

android {
    namespace "com.rusindu.cryptoaipro"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rusindu.cryptoaipro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                if (envStore) {
                    def f = new File(rootProject.buildDir, 'release.keystore')
                    f.parentFile.mkdirs()
                    f.bytes = envStore.decodeBase64()
                    storeFile f
                } else {
                    storeFile file(keystoreProperties.getProperty('storeFile'))
                }
                storePassword keystoreProperties.getProperty('storePassword') ?: System.getenv('KEYSTORE_PASSWORD')
                keyAlias keystoreProperties.getProperty('keyAlias') ?: System.getenv('KEY_ALIAS')
                keyPassword keystoreProperties.getProperty('keyPassword') ?: System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                /* still installable: sign with the debug key so CI always yields an APK */
                signingConfig signingConfigs.debug
            }
        }
    }

    /* deterministic, reproducible file names for CI artefacts */
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "CryptoAI-PRO-${appVersionName}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
