name: edulanka
description: >-
  EduLanka - free, ad-free, open source Sri Lankan school education app.
  School textbooks and past papers (O/L, A/L, Grade 5 Scholarship, term tests)
  in Sinhala, English and Tamil with offline reading.
publish_to: "none"

# versionName+versionCode (bump the number after "+" for every Play Store upload)
version: 1.0.0+1

environment:
  # Flutter 3.27+ is required for `Color.withValues()` and the Material 3
  # `surfaceContainer*` colour roles used by the theme. Any current stable
  # release works; `flutter upgrade` if `pub get` complains.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino localizations for si, ta, en (material widgets, date pickers...)
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Grapheme-cluster safe string handling - "පො" must not be cut in half when
  # the app builds initials/avatars out of Sinhala or Tamil titles.
  # `any` because the Flutter SDK pins `characters` itself; hard-pinning it here
  # is what breaks `pub get` on older SDK versions (same reason as `intl: any`).
  characters: any

  # ---------------------------------------------------------------- state mgmt
  flutter_riverpod: ^2.5.1

  # ------------------------------------------------------------------ firebase
  # Free "Spark" plan is enough: Firestore + Storage + (anonymous) Auth.
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_auth: ^5.3.1

  # ------------------------------------------------------------------ pdf view
  # flutter_pdfview = MIT licensed, renders with the OS PDF engine (small APK).
  # See docs/PDF_VIEWER.md if you prefer syncfusion_flutter_pdfviewer.
  flutter_pdfview: ^1.3.2

  # ------------------------------------------------------- local cache/offline
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # ------------------------------------------------------------- network/files
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  # Direct dependency (also pulled in by cached_network_image) so "Clear image
  # cache" in Settings can call DefaultCacheManager().emptyCache().
  flutter_cache_manager: ^3.4.1

  # ----------------------------------------------------------------- utilities
  # `intl: any` on purpose - flutter_localizations pins intl, hard pinning it
  # here breaks `pub get` on some Flutter SDK versions.
  intl: any
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/sample/
  # fonts:  # optional - bundle a Sinhala/Tamil display font if you want tighter
  #   - family: NotoSansSinhala
  #     fonts:
  #       - asset: assets/fonts/NotoSansSinhala-Regular.ttf
